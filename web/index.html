<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shop Bakaloo from your browser.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bakaloo">
  <meta name="theme-color" content="#6A1B9A">
  <link rel="apple-touch-icon" href="assets/assets/images/bakaloo-splash-screen.png">
  <link rel="icon" type="image/png" href="assets/assets/images/bakaloo-splash-screen.png">
  <link rel="manifest" href="manifest.json">
  <title>Bakaloo</title>
</head>
<body>
  <script src="checkout-bridge.js"></script>
  <script>
    // Flutter's generated worker intentionally unregisters itself on recent
    // SDKs. Register the small app-shell worker explicitly so installable
    // Bakaloo builds retain a safe offline navigation fallback.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var workerUrl = new URL('bakaloo_service_worker.js', document.baseURI);
        navigator.serviceWorker.register(workerUrl, { scope: workerUrl.pathname.replace(/[^/]+$/, '') })
          .catch(function () { /* Offline support is progressive enhancement. */ });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
